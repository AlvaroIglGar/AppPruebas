<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AppWebAssembly</title>
  <script>
    // GitHub Pages SPA redirect
    // project site => true porque tu repo es /AppPruebas/
    (function () {
      var l = window.location;
      var repoBase = '/AppPruebas';
      var newUrl =
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBase + '/?p=' +
        encodeURIComponent(l.pathname.slice(repoBase.length)) +
        '&q=' + encodeURIComponent(l.search.slice(1)) +
        l.hash;

      window.location.replace(newUrl);
    })();
  </script>
</head>
<body>
</body>
</html>
