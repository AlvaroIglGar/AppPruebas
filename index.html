<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppWebAssembly</title>
    <base href="/AppPruebas/" />

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="lib/fontawesome/css/all.css" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css?v=1" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="AppWebAssembly.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <script>
        window.changeThemeClass = function (isDark) {
            if (isDark) {
                document.body.classList.add("dark-root");
                document.documentElement.classList.add("dark-root");
                document.body.classList.remove("light-root");
                document.documentElement.classList.remove("light-root");
            } else {
                document.body.classList.add("light-root");
                document.documentElement.classList.add("light-root");
                document.body.classList.remove("dark-root");
                document.documentElement.classList.remove("dark-root");
            }
        };

        window.blazorGetWidth = () => window.innerWidth;
    </script>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var path = params.get('p');
            var query = params.get('q');

            if (path !== null) {
                var base = '/AppPruebas';
                var newUrl = base + path;

                if (query) {
                    newUrl += '?' + query;
                }

                if (window.location.hash) {
                    newUrl += window.location.hash;
                }

                window.history.replaceState(null, '', newUrl);
            }
        })();
    </script>
</head>
<body>
    <div id="app">
        <div class="loading-container">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text">Cargando...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js?v=1" defer></script>
</body>
</html>
